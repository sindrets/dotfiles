# Window rules (ported from hyprland window_rules.lua)

# suppress maximize events for all windows (hyprland suppress_event rule)
window_rule=ignore_maximize:1,app_id:.*

# floating windows
window_rule=is_floating:1,app_id:kitty_FLOAT
window_rule=is_floating:1,app_id:com.onepassword.OnePassword
window_rule=is_floating:1,app_id:pavucontrol-qt
window_rule=is_floating:1,app_id:thunar,title:File Operation Progress
window_rule=is_floating:1,app_id:thunar,title:Confirm to replace files
window_rule=is_floating:1,app_id:(Firefox Beta|zen),title:Picture-in-Picture
window_rule=is_floating:1,app_id:azote
window_rule=is_floating:1,app_id:steam,title:Friends List
window_rule=is_floating:1,app_id:^steam_app_.*

# steam ModOrganizer (hyprland border_size=0/no_shadow/no_blur)
window_rule=no_border:1,no_shadow:1,no_blur:1,app_id:steam_app_0,title:^ModOrganizer$

# affinity: force tiling (hyprland tile=true)
window_rule=force_tiled_state:1,app_id:affinity.exe

# screenkey: pinned floating overlay (hyprland pin/no_initial_focus/opacity 0.7/no decoration)
window_rule=is_floating:1,is_overlay:1,is_open_silent:1,focused_opacity:0.7,unfocused_opacity:0.7,no_border:1,no_shadow:1,no_blur:1,app_id:one.alynx.showmethekey
