# More option see https://github.com/DreamMaoMao/mango/wiki/

env=WLR_RENDERER,vulkan
source_optional=./monitors.conf
source=./window_rules.conf

env=XCURSOR_THEME,Vimix-cursors
env=XCURSOR_SIZE,24
cursor_theme=Vimix-cursors
cursor_size=24

env=TERMINAL,kitty
env=EDITOR,nvim

# Window effect
blur=0
blur_layer=0
blur_optimized=1
blur_params_num_passes = 2
blur_params_radius = 5
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2

shadows = 1
layer_shadows = 0
shadow_only_floating = 1
shadows_size = 20
shadows_blur = 36
shadows_position_x = -20
shadows_position_y = -6
shadows_color=0x000000cc

border_radius=8
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0

dim_enable=0
dim_focused_color=0x00000000
dim_unfocused_color=0x00000055

# Animation Configuration(support type:zoom,slide)
# tag_animation_direction: 1-horizontal,0-vertical
animations=1
layer_animations=1
animation_type_open=zoom
animation_type_close=fade
layer_animation_type_open=zoom
layer_animation_type_close=fade
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.4
zoom_end_ratio=0.0
fade_in_begin_opacity=0.5
fade_out_begin_opacity=0.8
animation_duration_move=300
animation_duration_open=200
animation_duration_tag=300
animation_duration_close=150
animation_duration_focus=0
animation_curve_open=0.25, 1, 0.5, 1
animation_curve_move=0.33,1,0.68,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opacity_fade_out=0.12,0,0.39,0
animation_curve_opacity_fade_in=0.46,1.0,0.29,1

# Scroller Layout Setting
scroller_structs=20
scroller_default_proportion=0.8
scroller_focus_center=0
scroller_prefer_center=0
edge_scroller_pointer_focus=1
edge_scroller_focus_allow_speed=0.0
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# Master-Stack Layout Setting
new_is_master=1
default_master_factor=0.55
default_master_count=1
tag_num=10
smart_gaps=0

# Dwindle Layout Setting
dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_horizontal_split=1
dwindle_vertical_split=1
# (hyprland dwindle: preserve_split=true, force_split/use_active_for_splits have no mango equivalent)
dwindle_preserve_split=1

# Monocle Layout Setting
monocle_tab_mode=1
monocle_no_border=0
monocle_no_gap=0

# Deck Layout Setting
deck_tab_mode=1

# Overview Setting
hotarea_size=10
enable_hotarea=0
hotarea_disable_on_fullscreen=1
overview_gap_inner=5
overview_gap_outer=30
overcircle_center_ratio=0.5

# Misc
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
idle_inhibit_ignore_visible=0
idle_inhibit_when_fullscreen=0
sloppy_focus=1
warp_cursor=1
focus_cross_monitor=1
focus_direction_only_zone_overlap=1
focus_cross_tag=0
exchange_cross_monitor=1
enable_floating_snap=0
snap_distance=30
float_full_to_top=0
drag_tile_to_tile=1
drag_tile_small=1
xwayland_ignore_scale=1
scratchpad_cross_monitor=1

# keyboard
repeat_rate=60
repeat_delay=200
numlock_on=0
xkb_rules_layout=us,no
xkb_rules_options=caps:escape,terminate:ctrl_alt_bksp,grp:shift_caps_toggle

# Trackpad
# need relogin to make it apply
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=1
trackpad_disable_while_typing=1
trackpad_left_handed=0
trackpad_middle_button_emulation=0
swipe_min_threshold=1

# mouse
# need relogin to make it apply
mouse_natural_scrolling=0

# Appearance
gap_inner_horizontal=5
gap_inner_vertical=5
gap_outer_horizontal=20
gap_outer_vertical=20
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
border_px=1
root_color=0x201b14ff
border_color=0x595959aa
focus_color=0x888888ff
drop_color=0x8FBA7C55
split_color=0xEB441EFF
maximized_screen_color=0x89aa61ff
urgent_color=0xad401fff
scratchpad_color=0x516c93ff
global_color=0xb153a7ff
overlay_color=0x14a57cff

# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller
tag_rule=id:1,layout_name:dwindle
tag_rule=id:2,layout_name:dwindle
tag_rule=id:3,layout_name:dwindle
tag_rule=id:4,layout_name:dwindle
tag_rule=id:5,layout_name:dwindle
tag_rule=id:6,layout_name:dwindle
tag_rule=id:7,layout_name:dwindle
tag_rule=id:8,layout_name:dwindle
tag_rule=id:9,layout_name:dwindle
tag_rule=id:10,layout_name:dwindle

# Key Bindings
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none

# reload config
bind=SUPER+Shift,r,reload_config

# menu and terminal
bind=Super,space,spawn,~/.config/rofi/applets/launchers-git/launcher.sh
bind=Super,Return,spawn,kitty
bind=Super+Shift,Return,spawn,kitty --class kitty_FLOAT
bind=Super,e,spawn,thunar
bind=Alt_R,3,spawn,1password
bind=SUPER,p,spawn,nwg-displays

# exit
bind=SUPER,m,quit
bind=Super+Shift,q,killclient,

# system menu (ported from hyprland mod+SHIFT+E)
bind=SUPER+Shift,E,spawn,~/.config/mango/scripts/system-menu

# screenshots (hyprland Print / mod+SHIFT+Print)
bind=NONE,Print,spawn,~/.config/scripts/screenshot-utils.sh -s
bind=SUPER+SHIFT,Print,spawn,~/.config/scripts/screenshot-utils.sh -a

# emoji picker
bind=Super,period,spawn,rofi -modi emoji -show emoji

# Magnify
axisbind=Super+Shift,UP,spawn,~/.config/mango/scripts/wooz-single.sh
# axisbind=Super+Shift,DOWN,spawn,pkill wooz

# switch window focus
bind=Super,h,focusdir,left
bind=Super,j,focusdir,down
bind=Super,k,focusdir,up
bind=Super,l,focusdir,right

# move window
bind=SUPER+SHIFT,Up,move_client,up
bind=SUPER+SHIFT,Down,move_client,down
bind=SUPER+SHIFT,Left,move_client,left
bind=SUPER+SHIFT,Right,move_client,right

# move focused window: tiled -> reorder in layout, floating -> nudge 30px (hyprland smart_move script)
bind=SUPER+SHIFT,h,spawn,~/.config/mango/scripts/move-window.sh left
bind=SUPER+SHIFT,j,spawn,~/.config/mango/scripts/move-window.sh down
bind=SUPER+SHIFT,k,spawn,~/.config/mango/scripts/move-window.sh up
bind=SUPER+SHIFT,l,spawn,~/.config/mango/scripts/move-window.sh right

# switch window status
bind=SUPER,g,toggleglobal,
bind=ALT,Tab,togglejump,
bind=Super+Shift,space,togglefloating,
bind=ALT,a,togglemaximizescreen,
bind=Super,f,togglefullscreen,
# bind=ALT+SHIFT,f,togglefakefullscreen,
bind=SUPER,i,minimized,
bind=SUPER+SHIFT,I,restore_minimized
bind=SUPER+Shift,o,toggleoverlay,
bind=Super,minus,toggle_scratchpad
# move focused window to scratchpad (hyprland SHIFT+Minus toggle_move_special)
bind=SUPER+SHIFT,minus,minimized

# scroller layout
bind=ALT,e,set_proportion,1.0
bind=ALT,x,switch_proportion_preset,
bind=alt+super+ctrl,Left,scroller_stack,left
bind=alt+super+ctrl,Right,scroller_stack,right
bind=alt+super+ctrl,Up,scroller_stack,up
bind=alt+super+ctrl,Down,scroller_stack,down

#dwindle layout(manual split mode)
bind=alt+shift,Return,dwindle_toggle_split_direction

# switch layout
bind=SUPER,n,switch_layout

# tag switch
bind=SUPER,Left,viewtoleft_have_client,0
bind=SUPER,Right,viewtoright_have_client,0
bind=SUPER+Ctrl,Left,tagtoleft,0
bind=SUPER+Ctrl,Right,tagtoright,0

bind=Super,1,view,1,0
bind=Super,2,view,2,0
bind=Super,3,view,3,0
bind=Super,4,view,4,0
bind=Super,5,view,5,0
bind=Super,6,view,6,0
bind=Super,7,view,7,0
bind=Super,8,view,8,0
bind=Super,9,view,9,0
bind=Super,0,view,10

# previous workspace per monitor (hyprland mod+B previous_per_monitor; view -1 = previous tagset,
# which toggles between the two most recently viewed tags)
bind=SUPER,b,view,-1
# next/prev occupied workspace with wraparound (hyprland mod+Tab / mod+SHIFT+Tab);
# mangowm's *_have_client dispatchers don't wrap, so this uses a mmsg helper script
bind=SUPER,Tab,spawn,~/.config/mango/scripts/cycle-tags.sh next
bind=SUPER+SHIFT,Tab,spawn,~/.config/mango/scripts/cycle-tags.sh prev

# move focused window to tag (hyprland mod+SHIFT+[1-9])
bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

# move focused window to tag silently (hyprland mod+CTRL+[1-9])
bind=SUPER+CTRL,1,tagsilent,1
bind=SUPER+CTRL,2,tagsilent,2
bind=SUPER+CTRL,3,tagsilent,3
bind=SUPER+CTRL,4,tagsilent,4
bind=SUPER+CTRL,5,tagsilent,5
bind=SUPER+CTRL,6,tagsilent,6
bind=SUPER+CTRL,7,tagsilent,7
bind=SUPER+CTRL,8,tagsilent,8
bind=SUPER+CTRL,9,tagsilent,9

# monitor switch
# bind=alt+shift,Left,focusmon,left
# bind=alt+shift,Right,focusmon,right
# bind=SUPER+Alt,Left,tagmon,left
# bind=SUPER+Alt,Right,tagmon,right

# gaps
# bind=ALT+SHIFT,X,incgaps,1
# bind=ALT+SHIFT,Z,incgaps,-1
bind=Super,o,togglegaps

# window resize mode (ported from hyprland mod+R submap)
bind=SUPER,r,setkeymode,resize

key_mode=resize
bind=NONE,h,resizewin,-20,+0
bind=NONE,j,resizewin,+0,+20
bind=NONE,k,resizewin,+0,-20
bind=NONE,l,resizewin,+20,+0
bind=NONE,Return,setkeymode,default
bind=NONE,Escape,setkeymode,default
key_mode=default

# multimedia keys (ported from hyprland; its `repeating` flag has no mango equivalent)
bindl=NONE,XF86AudioRaiseVolume,spawn,~/.config/i3/scripts/volume-utils.sh --inc 2
bindl=NONE,XF86AudioLowerVolume,spawn,~/.config/i3/scripts/volume-utils.sh --dec 2
bindl=NONE,XF86AudioMute,spawn,~/.config/i3/scripts/volume-utils.sh --mute
bindl=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl=NONE,XF86AudioPlay,spawn,~/.config/i3/scripts/playerctl-utils.sh --use-active play-pause
# bindl=NONE,XF86AudioPause,spawn,~/.config/i3/scripts/playerctl-utils.sh --use-active pause
bindl=NONE,XF86AudioNext,spawn,~/.config/i3/scripts/playerctl-utils.sh --use-active next
bindl=NONE,XF86AudioPrev,spawn,~/.config/i3/scripts/playerctl-utils.sh --use-active previous
bindl=NONE,XF86AudioStop,spawn,~/.config/i3/scripts/playerctl-utils.sh --use-active stop
bindl=NONE,XF86MonBrightnessUp,spawn,~/.config/i3/scripts/brightness.sh --inc
bindl=NONE,XF86MonBrightnessDown,spawn,~/.config/i3/scripts/brightness.sh --dec

# extra media keys for keyboards without them (hyprland)
bindl=SUPER,Prior,spawn,~/.config/i3/scripts/volume-utils.sh --inc 2
bindl=SUPER,Next,spawn,~/.config/i3/scripts/volume-utils.sh --dec 2
bindl=SUPER,Insert,spawn,~/.config/i3/scripts/playerctl-utils.sh --use-active play-pause
bindl=SUPER,Home,spawn,~/.config/i3/scripts/playerctl-utils.sh --use-active previous
bindl=SUPER,End,spawn,~/.config/i3/scripts/playerctl-utils.sh --use-active next
bindl=SUPER,Delete,spawn,~/.config/i3/scripts/volume-utils.sh --mute

# Mouse Button Bindings
# btn_left and btn_right can't bind none mod key
mousebind=SUPER,btn_left,moveresize,curmove
# mousebind=NONE,btn_middle,togglemaximizescreen,0
mousebind=SUPER,btn_right,moveresize,curresize

# Axis Bindings
axisbind=SUPER,UP,spawn,~/.config/mango/scripts/cycle-tags.sh prev
axisbind=SUPER,DOWN,spawn,~/.config/mango/scripts/cycle-tags.sh next

# Gesture Bindings
gesturebind=none,left,3,focusdir,left
gesturebind=none,right,3,focusdir,right
gesturebind=none,up,3,focusdir,up
gesturebind=none,down,3,focusdir,down
gesturebind=none,right,4,viewprev_have_client
gesturebind=none,left,4,viewnext_have_client
gesturebind=none,up,4,enteroverview
gesturebind=none,down,4,leaveoverview

# layer rule
layer_rule=animation_type_open:zoom,layer_name:rofi
layer_rule=animation_type_close:fade,layer_name:rofi

layer_rule=animation_type_open:none,layer_name:wooz
layer_rule=animation_type_open:none,layer_name:slosh-region

# --- Autostart applications ---

exec_once=/usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec_once=xrdb -merge "$HOME/.Xresources"
exec_once=swaync
exec_once=waybar --config="$HOME/.config/waybar/themes/mango/config"
exec_once=bash -c '[ -x ~/.azotebg ] && ~/.azotebg'
exec_once=udiskie
exec_once=env QT_QPA_PLATFORM=xcb insync start
exec_once=thunar --daemon
exec_once=bash -c 'command -v hushmic && hushmic'

# vim: ft=ini
